<div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
  <div
    class="logout-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-title"
    aria-describedby="logout-description"
  >
    <!-- Icon -->
    <div class="logout-icon-wrapper">
      <div class="logout-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M10 17L15 12L10 7"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

          <path
            d="M14 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <!-- Content -->
    <div class="modal-content">
      <h2 id="logout-title">Sign out?</h2>

      <p id="logout-description">Are you sure you want to sign out of your account?</p>
    </div>

    <!-- Actions -->
    <div class="modal-actions">
      <button type="button" class="cancel-button" [disabled]="isLoggingOut" (click)="cancel()">
        Cancel
      </button>

      <button
        type="button"
        class="logout-button"
        [disabled]="isLoggingOut"
        (click)="confirmLogout()"
      >
        @if (isLoggingOut) {
          <span class="spinner"></span>
          <span>Signing out...</span>
        } @else {
          <span>Sign out</span>
        }
      </button>
    </div>
  </div>
</div>
