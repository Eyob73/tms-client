<div class="card">
    <h3>{{ course().courseName || course().title }} ({{ course().courseCode || course().code }})</h3>
    <p>
        {{ enrollmentText() }}
    </p>
    <span class="badge" [class.closed]="isFull()">
        {{ isFull() ? "Full" : "Accepting enrollments" }}
    </span>
    <button (click)="enrollClicked.emit(course())" [disabled]="isFull()">
        Enroll
    </button>
    <h3>
        <a [routerLink]="['/courses', course().id]"> {{ course().courseName || course().title }} </a>
        ({{ course().courseCode || course().code }})
    </h3>
</div>
